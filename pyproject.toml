[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solari-lab"
version = "0.1.0"
description = "solab: diagnostics, benchmarks, isolation and proxy checks, session and cost tracking for your Solari account."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Moaz Essam" }]
keywords = ["solari", "cloud browser", "benchmark", "diagnostics", "cli"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
solab = "solari_lab.cli:app"

[project.urls]
Homepage = "https://github.com/moazessam376-dev/solari-lab"
Solari = "https://getsolari.com"

[tool.hatch.build.targets.wheel]
packages = ["src/solari_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "PYI034", "S110", "RUF046", "E731"]
